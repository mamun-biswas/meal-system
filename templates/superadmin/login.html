{% extends 'superadmin/base_admin.html' %}
{% block auth_content %}
<style>
.sa-login-root{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,var(--accent-soft) 0%,transparent 55%),var(--bg);padding:24px;position:relative}
.sa-theme-toggle{position:absolute;top:24px;right:24px}
.sa-login-card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:40px 36px;box-shadow:var(--shadow)}
.sa-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;box-shadow:0 8px 32px var(--accent-soft)}
.sa-title{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.4px;margin-bottom:4px}
.sa-sub{font-size:13px;color:var(--t3);text-align:center;margin-bottom:26px}
</style>
<div class="sa-login-root">
  <button class="icon-btn sa-theme-toggle" onclick="toggleAdminTheme()" id="sa-theme-btn" title="Toggle theme">🌙</button>
  <div class="sa-login-card">
    <div class="sa-icon">🛡️</div>
    <div class="sa-title">Global Admin</div>
    <div class="sa-sub">Superuser access only</div>

    {% if messages %}{% for msg in messages %}
    <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags|default:'info' }}{% endif %}">
      <span>❌</span><span>{{ msg }}</span>
    </div>{% endfor %}{% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username-input">Username</label>
        <input id="username-input" name="username" type="text" class="form-control"
               placeholder="Superuser username" required autofocus value="{{ username|default:'' }}">
      </div>
      <div class="form-group" style="margin-bottom:22px">
        <label class="form-label" for="password-input">Password</label>
        <input id="password-input" name="password" type="password" class="form-control"
               placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">Sign In →</button>
    </form>

    <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--t3)">
      Not an admin? <a href="{% url 'login' %}">Go to mess login →</a>
    </div>
  </div>
</div>
{% endblock %}
